name: GarasiKu Web Next CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web-next/**"
      - ".github/workflows/garasiku-web-next.yml"
  push:
    branches: ["feat/garasiku-next-platform"]
    paths:
      - "web-next/**"
      - ".github/workflows/garasiku-web-next.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm install
      - run: npm run build
